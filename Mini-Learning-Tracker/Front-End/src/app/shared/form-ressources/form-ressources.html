<form (ngSubmit)="onSubmit()" [formGroup]="form">

  <div>
    <label>title</label>
    <input formControlName="title" type="text" />
    <span *ngIf="form.get('title')?.invalid && form.get('title')?.touched">Title requis </span>
  </div>

  <div>
    <label>Description</label>
    <input formControlName="description" type="text" />
    <span *ngIf="form.get('description')?.invalid && form.get('description')?.touched">Description requise</span>
  </div>

  <!-- <div>
    <label>Category</label>
    <input formControlName="category" type="text" />
    <span *ngIf="form.get('category')?.invalid && form.get('category')?.touched">Catégorie requise</span>
  </div> -->

  <button type="submit" [disabled]="form.invalid">Envoyer</button>

  <p *ngIf="success">Ressource créée avec succès !</p>

  <p *ngIf="errorMsg">{{ errorMsg }}</p>

</form>
